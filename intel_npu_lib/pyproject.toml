[build-system]
requires = ["setuptools", "wheel", "torch", "openvino"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::torch.jit.TracerWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
