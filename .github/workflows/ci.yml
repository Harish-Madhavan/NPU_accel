name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.12']
      fail-fast: false
    env:
      DISTUTILS_USE_SDK: "1"
      FORCE_CUDA: "0"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
        
    - name: Set up Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-python-${{ matrix.python-version }}
        max-size: 500M
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install openvino
        pip install ninja pytest pytest-cov build ruff
        cd intel_npu_lib
        python setup.py develop --no-deps
      shell: bash
        
    - name: Run linter
      run: |
        ruff check ./intel_npu_lib || true
      shell: bash
        
    - name: Run test suite with coverage
      run: |
        cd intel_npu_lib
        pytest -v --cov=intel_npu_acceleration --cov-report=html --cov-report=xml tests/
      shell: bash
      
    - name: Build Wheel
      run: |
        python -m build --wheel --no-build-isolation ./intel_npu_lib
      shell: bash
        
    - name: Upload Built Wheel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-python-${{ matrix.python-version }}
        path: intel_npu_lib/dist/*.whl
        if-no-files-found: warn
        
    - name: Upload Test Coverage HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-python-${{ matrix.python-version }}
        path: intel_npu_lib/htmlcov/
        if-no-files-found: ignore
