name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.12']
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Set up Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-python-${{ matrix.python-version }}
        max-size: 500M
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ninja pytest-xdist pytest-cov build ruff
        # Link compiler to ccache on Linux for speed
        if [ "$RUNNER_OS" == "Linux" ]; then
          export CC="ccache gcc"
          export CXX="ccache g++"
        fi
        pip install -e "./intel_npu_lib[dev]"
      shell: bash
        
    - name: Run linter
      run: |
        ruff check ./intel_npu_lib
        
    - name: Run tests with coverage
      run: |
        pytest -n auto --cov=intel_npu_acceleration --cov-report=html --cov-report=xml ./intel_npu_lib/tests
      shell: bash
      
    - name: Build Wheel
      run: |
        python -m build --wheel ./intel_npu_lib
      shell: bash
        
    - name: Upload Built Wheel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-python-${{ matrix.python-version }}
        path: intel_npu_lib/dist/*.whl
        
    - name: Upload Test Coverage HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-python-${{ matrix.python-version }}
        path: htmlcov/
