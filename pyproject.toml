[build-system]
requires = ["setuptools>=77", "wheel", "torch>=2.1", "openvino>=2024.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intel_npu_acceleration"
version = "0.2.0"
description = "PyTorch acceleration library for Intel NPU — Level Zero / OpenVINO backend"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
keywords = ["intel", "npu", "openvino", "pytorch", "level-zero"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "torch>=2.1",
    "openvino>=2024.0.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Harish-Madhavan/NPU_accel"
Documentation = "https://github.com/Harish-Madhavan/NPU_accel#readme"
Issues = "https://github.com/Harish-Madhavan/NPU_accel/issues"

[project.scripts]
intel-npu-info = "intel_npu_acceleration.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "build"]

[project.entry-points."torch_dynamo_backends"]
npu = "intel_npu_acceleration.frontend.dynamo:_compile_backend"
intel_npu = "intel_npu_acceleration.frontend.dynamo:_compile_backend"
